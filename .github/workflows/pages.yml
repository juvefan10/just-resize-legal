name: Publish legal pages

# Deploys legal/ to GitHub Pages, so the three documents get public HTTPS URLs without a
# separate repo or host. Enable it once: Settings → Pages → Source: GitHub Actions.
# The URLs then become https://<user>.github.io/<repo>/privacy-policy.html and so on.

on:
  push:
    branches: [main]
    paths:
      - 'legal/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal

      - id: deployment
        uses: actions/deploy-pages@v4
